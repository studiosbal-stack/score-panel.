<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jor Punjab Da - Live Controller</title>
    <style>
        /* BASE STYLES */
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        
        /* ================= OBS VIEW STYLES ================= */
        #obs-view { display: none; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        .watermark { position: absolute; font-size: 30px; color: rgba(255, 255, 255, 0.15); font-weight: bold; text-transform: uppercase; letter-spacing: 2px; animation: floatLogo 25s infinite alternate linear; pointer-events: none; z-index: 1000; }
        @keyframes floatLogo { 0% { top: 10%; left: 5%; transform: scale(1); } 33% { top: 50%; left: 60%; transform: scale(1.1); } 66% { top: 80%; left: 30%; transform: scale(0.9); } 100% { top: 20%; left: 70%; transform: scale(1); } }
        .lower-third-container { position: absolute; bottom: 0; width: 100%; height: 80px; background-color: #000000; border-bottom: 5px solid #005a9e; display: flex; font-size: 34px; line-height: 80px; }
        .part { flex: 1; overflow: hidden; position: relative; white-space: nowrap; padding: 0 15px;}
        .part1 { border-right: 2px solid white; text-align: center; color: #ffcc00; } /* Default Yellow */
        .part2 { border-right: 2px solid white; color: #ffffff; } /* Default White */
        .part3 { color: #ffffff; } /* Default White */
        .scroller { display: inline-block; padding-left: 100%; animation: scroll-left 15s linear infinite; }
        @keyframes scroll-left { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

        /* ================= CONTROL PANEL STYLES ================= */
        #admin-view { display: none; background: #222; color: white; min-height: 100vh; padding: 15px; box-sizing: border-box; }
        .panel { background: #333; padding: 20px; border-radius: 8px; max-width: 600px; margin: auto; display: none;}
        .login-box { text-align: center; margin-top: 50px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; border-radius: 4px; border: none;}
        .color-picker { padding: 0; height: 45px; cursor: pointer; border: 2px solid #555; }
        button { padding: 15px; width: 100%; margin-bottom: 10px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; font-size: 16px;}
        .login-btn { background: #ffffff; color: #333; }
        .update-btn { background: #0078d7; color: white; margin-top: 10px;}
        .pause-btn { background: #d9534f; color: white; }
        .play-btn { background: #5cb85c; color: white; }
        .copy-btn { background: #ff9800; color: white; border: 2px dashed #fff; margin-top: 20px; }
        #userInfo { color: #ffcc00; margin-bottom: 15px; font-size: 14px; text-align: center;}
    </style>
</head>
<body>

    <!-- ================= OBS VIEW (Scoreboard) ================= -->
    <div id="obs-view">
        <div class="watermark">Jor Punjab Da</div>
        <div class="lower-third-container">
            <div class="part part1" id="box1">LIVE STREAM</div>
            <div class="part part2"><div class="scroller" id="scroll2">Waiting for updates...</div></div>
            <div class="part part3"><div class="scroller" id="scroll3">Waiting for updates...</div></div>
        </div>
    </div>

    <!-- ================= ADMIN VIEW (Mobile Control) ================= -->
    <div id="admin-view">
        <div class="login-box" id="loginBox">
            <h2>Admin Login</h2>
            <p>Please login with studiosbal@gmail.com</p>
            <button class="login-btn" onclick="signIn()">🛡️ Login with Google</button>
            <p id="errorMsg" style="color: red;"></p>
        </div>

        <div class="panel" id="controlPanel">
            <h3 style="text-align:center; margin-top:0;">Mobile Score Controller</h3>
            <div id="userInfo"></div>
            
            <!-- TEXT INPUTS -->
            <label>Part 1 (Static Box):</label>
            <input type="text" id="input1" placeholder="e.g. LIVE STREAM">
            
            <label>Part 2 (Scroll Line 1):</label>
            <input type="text" id="input2" placeholder="e.g. OPEN | 2ND PRIZE: 0">
            
            <label>Part 3 (Scroll Line 2):</label>
            <input type="text" id="input3" placeholder="e.g. KABADDI 65KG FZR VS MUDKI">

            <!-- COLOR CONTROLS -->
            <label>Text Colors (Rang Select Karein):</label>
            <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                <div style="flex: 1; text-align: center;">
                    <span style="font-size: 12px;">Part 1</span>
                    <input type="color" id="color1" class="color-picker" value="#ffcc00">
                </div>
                <div style="flex: 1; text-align: center;">
                    <span style="font-size: 12px;">Part 2</span>
                    <input type="color" id="color2" class="color-picker" value="#ffffff">
                </div>
                <div style="flex: 1; text-align: center;">
                    <span style="font-size: 12px;">Part 3</span>
                    <input type="color" id="color3" class="color-picker" value="#ffffff">
                </div>
            </div>

            <!-- SPEED CONTROL -->
            <label>Scroll Speed (Chalna Di Speed):</label>
            <select id="speedSelect">
                <option value="10">Fast (Tez)</option>
                <option value="15">Normal</option>
                <option value="25">Slow (Holi)</option>
                <option value="35">Very Slow (Bahut Holi)</option>
            </select>

            <button class="update-btn" id="updateBtn" onclick="updateData()">Update OBS Live</button>
            
            <!-- PLAY / PAUSE BUTTONS -->
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="pause-btn" onclick="setPause('yes')">Pause Scroll</button>
                <button class="play-btn" onclick="setPause('no')">Play Scroll</button>
            </div>

            <button class="copy-btn" onclick="copyObsLink()">📋 Copy OBS Browser Link</button>
            <button onclick="signOut()" style="background: #555; color: white; margin-top: 10px;">Logout</button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // ================= FIREBASE CONFIG =================
        // YAHAN APNA ASLI FIREBASE CONFIG PASTE KAREIN
       const firebaseConfig = {
  apiKey: "AIzaSyApBkjrOj1W7voyrLP7Vc2DbtnN5NvG4-c",
  authDomain: "jor-punjab-live.firebaseapp.com",
  databaseURL: "https://jor-punjab-live-default-rtdb.firebaseio.com",
  projectId: "jor-punjab-live",
  storageBucket: "jor-punjab-live.firebasestorage.app",
  messagingSenderId: "567455364157",
  appId: "1:567455364157:web:b1ffea84c70fc02af92654",
  measurementId: "G-0RCR8PM6EH"
};
        firebase.initializeApp(firebaseConfig);
        
        var database = firebase.database();
        
        // ================= SMART LINK LOGIC =================
        const isObsView = window.location.href.includes('?view=obs');

        if (isObsView) {
            // OBS View
            document.body.style.backgroundColor = "transparent";
            document.getElementById('obs-view').style.display = "block";
            
            database.ref('scoreboard').on('value', function(snapshot) {
                var data = snapshot.val();
                if(data) {
                    // Update Texts
                    document.getElementById('box1').innerText = data.box1;
                    document.getElementById('scroll2').innerText = data.box2;
                    document.getElementById('scroll3').innerText = data.box3;
                    
                    // Update Colors
                    document.getElementById('box1').style.color = data.color1 || "#ffcc00";
                    document.getElementById('scroll2').style.color = data.color2 || "#ffffff";
                    document.getElementById('scroll3').style.color = data.color3 || "#ffffff";
                    
                    // Update Speed
                    var speed = data.scrollSpeed || "15"; 
                    document.getElementById('scroll2').style.animationDuration = speed + 's';
                    document.getElementById('scroll3').style.animationDuration = speed + 's';

                    // Update Pause/Play Status
                    if(data.isPaused === "yes") {
                        document.getElementById('scroll2').style.animationPlayState = 'paused';
                        document.getElementById('scroll3').style.animationPlayState = 'paused';
                    } else {
                        document.getElementById('scroll2').style.animationPlayState = 'running';
                        document.getElementById('scroll3').style.animationPlayState = 'running';
                    }
                }
            });

        } else {
            // Admin Panel
            document.getElementById('admin-view').style.display = "block";
            var auth = firebase.auth();
            var currentPauseState = "no";
            const allowedEmail = "studiosbal@gmail.com";
            var provider = new firebase.auth.GoogleAuthProvider();

            function signIn() { auth.signInWithPopup(provider).catch(function(error) { document.getElementById('errorMsg').innerText = error.message; }); }
            function signOut() { auth.signOut(); }

            auth.onAuthStateChanged(function(user) {
                if (user) {
                    if(user.email === allowedEmail) {
                        document.getElementById('loginBox').style.display = 'none';
                        document.getElementById('controlPanel').style.display = 'block';
                        document.getElementById('userInfo').innerText = "Logged in as: " + user.email;
                        loadSavedData();
                    } else { document.getElementById('errorMsg').innerText = "Access Denied. Only studiosbal@gmail.com allowed."; signOut(); }
                } else {
                    document.getElementById('loginBox').style.display = 'block';
                    document.getElementById('controlPanel').style.display = 'none';
                }
            });

            function loadSavedData() {
                database.ref('scoreboard').once('value').then(function(snapshot) {
                    var data = snapshot.val();
                    if(data) {
                        // Load Text Inputs
                        document.getElementById('input1').value = data.box1 || "";
                        document.getElementById('input2').value = data.box2 || "";
                        document.getElementById('input3').value = data.box3 || "";
                        
                        // Load Colors
                        document.getElementById('color1').value = data.color1 || "#ffcc00";
                        document.getElementById('color2').value = data.color2 || "#ffffff";
                        document.getElementById('color3').value = data.color3 || "#ffffff";
                        
                        // Load Speed
                        document.getElementById('speedSelect').value = data.scrollSpeed || "15"; 
                        currentPauseState = data.isPaused || "no";
                    }
                });
            }

            window.updateData = function() {
                var btn = document.getElementById('updateBtn');
                btn.innerText = "Saving Data...";
                database.ref('scoreboard').set({ 
                    box1: document.getElementById('input1').value, 
                    box2: document.getElementById('input2').value, 
                    box3: document.getElementById('input3').value,
                    color1: document.getElementById('color1').value,
                    color2: document.getElementById('color2').value,
                    color3: document.getElementById('color3').value,
                    scrollSpeed: document.getElementById('speedSelect').value, 
                    isPaused: currentPauseState 
                }).then(() => {
                    btn.innerText = "Updated Live!"; 
                    setTimeout(() => btn.innerText = "Update OBS Live", 2000);
                });
            };

            window.setPause = function(state) { currentPauseState = state; updateData(); };

            window.copyObsLink = function() {
                var obsLink = window.location.origin + window.location.pathname + "?view=obs";
                navigator.clipboard.writeText(obsLink).then(function() {
                    alert("OBS Browser Link Copied!\n\n" + obsLink + "\n\nIse apne PC (OBS Studio) me Browser Source me paste karein.");
                }, function(err) {
                    alert("Copy karne me error aaya. Link khud bana lein: " + obsLink);
                });
            };
        }
    </script>
</body>
</html>
